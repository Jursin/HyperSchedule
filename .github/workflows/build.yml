name: Build and Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests, lint and build debug APKs
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: hyperschedule-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Build and publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release tag matches app version
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version_name"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            printf 'signing.storeFile=%s\n' "$RUNNER_TEMP/release.keystore"
            printf 'signing.storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'signing.keyAlias=%s\n' "$KEY_ALIAS"
            printf 'signing.keyPassword=%s\n' "$KEY_PASSWORD"
          } > local.properties

      - name: Run unit tests and build signed release APKs
        run: bash ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Verify release APK signatures
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$apksigner" verify --print-certs "$apk"
          done

      - name: Preserve R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: hyperschedule-${{ github.ref_name }}-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(app/build/outputs/apk/release/*.apk)
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          version="${GITHUB_REF_NAME#v}"
          body=$(awk -v ver="$version" '
            /^## / {
              if (found) exit
              split(substr($0, 4), head, " ")
              title = head[1]
              sub(/^[vV]/, "", title)
              if (title == ver) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d')
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            if [ -n "$body" ]; then gh release edit "$GITHUB_REF_NAME" --notes "$body"; fi
          elif [ -n "$body" ]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --notes "$body" "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes "${flags[@]}"
          fi
